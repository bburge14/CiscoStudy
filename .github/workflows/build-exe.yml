name: Build Windows EXE

# Produces a standalone CertLab.exe on a Windows runner and uploads it as a
# downloadable artifact. Runs when packaging/source changes on this branch,
# on demand (Actions tab -> Run workflow), and on version tags (attaches the
# exe to a GitHub Release).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - claude/beautiful-mayer-x6lhc8
      - main
    paths:
      - "CertLab.spec"
      - "launcher.py"
      - "packaging/**"
      - ".github/workflows/build-exe.yml"
      - "Home.py"
      - "ui_common.py"
      - "ui_icons.py"
      - "views/**"
      - "studyengine/**"
      - "data/**"

permissions:
  contents: write   # needed to attach the exe to a Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt

      - name: Generate the question bank
        run: python tools/build_content.py

      - name: Run the test suite
        run: |
          pip install pytest
          python -m pytest -q

      - name: Build CertLab.exe
        run: pyinstaller --noconfirm --clean CertLab.spec

      - name: Show build output
        run: dir dist

      - name: Upload the exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CertLab-windows-exe
          path: dist/CertLab.exe
          if-no-files-found: error

      - name: Attach exe to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CertLab.exe
